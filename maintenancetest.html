    <style>
        span { display: inline !important; }
        a { color: #B8860B !important; transition: all 0.2s ease-in-out; }
        a:hover { color: #ffd700 !important; text-decoration: none; }

        /* Badge stato del sistema */
        .status-badge-container {
            margin: 18px 0;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(184, 134, 11, 0.6);
            padding: 8px 18px;
            border-radius: 50px;
            color: #fff !important;
            font-size: 13px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(184, 134, 11, 0.25);
        }
        .status-badge:hover {
            border-color: #ffd700;
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.4);
            color: #fff !important;
        }
        .status-dot {
            width: 9px;
            height: 9px;
            background-color: #00ff66;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 8px #00ff66;
            animation: pulse-dot 1.8s infinite;
        }
        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        /* Pulsanti azione */
        .action-buttons {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .button-xs {
            display: inline-block;
            margin: 4px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(184, 134, 11, 0.7);
            border-radius: 4px;
            color: #fff !important;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
        .button-xs:hover {
            background: rgba(184, 134, 11, 0.3);
            border-color: #ffd700;
            color: #fff !important;
        }
        .button-status {
            border-color: #00ff66 !important;
            color: #e6ffe6 !important;
        }
        .button-status:hover {
            background: rgba(0, 255, 102, 0.2) !important;
            border-color: #00ff66 !important;
        }

        /* Pannello contatti */
        .social-cards-grid {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 25px;
        }
        .social-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            transition: all 0.3s;
        }
        .social-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(184, 134, 11, 0.8);
        }
        .social-card i {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }
        .social-card a {
            display: block;
            margin-top: 8px;
            font-weight: 500;
        }
        .email-box {
            background: rgba(0,0,0,0.4);
            border: 1px dashed rgba(184, 134, 11, 0.5);
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
    </style>
